name: Supabase keep-alive

# Interroge la base une fois par jour pour éviter la mise en pause
# du projet Supabase gratuit après une semaine d'inactivité.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête vers Supabase
